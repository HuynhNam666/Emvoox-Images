name: emvoox-studio

x-backend-env: &backend-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}  # URL is built (and escaped) in app/config.py
  DB_HOST: postgres
  MAX_ZIP_FILES: ${MAX_ZIP_FILES:-3000}
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  ASSET_STORAGE_BACKEND: postgres
  IMAGE_PROVIDER: ${IMAGE_PROVIDER:-sdxl}
  SDXL_MODEL_ID: ${SDXL_MODEL_ID:-stabilityai/stable-diffusion-xl-base-1.0}
  SDXL_REVISION: ${SDXL_REVISION:-}
  HF_TOKEN: ${HF_TOKEN:-}
  LOW_VRAM_OFFLOAD: ${LOW_VRAM_OFFLOAD:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emvoox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: emvoox_images
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emvoox -d emvoox_images"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &log {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  redis:
    image: redis:7
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
    logging: *log

  migrate:  # run explicitly: docker compose run --rm migrate
    build: {context: ./backend, dockerfile: ../infra/docker/api.Dockerfile}
    command: alembic upgrade head
    environment: *backend-env
    depends_on: {postgres: {condition: service_healthy}}
    profiles: [tools]

  api:
    build: {context: ./backend, dockerfile: ../infra/docker/api.Dockerfile}
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]  # only for /docs and debugging; the web container uses the internal network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *log

  beat:  # outbox/liveness sweeper only; does not touch the GPU
    build: {context: ./backend, dockerfile: ../infra/docker/api.Dockerfile}
    command: celery -A app.workers.celery_app beat -l info
    environment: *backend-env
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped
    logging: *log

  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    restart: unless-stopped

  worker-gpu:  # docker compose --profile gpu up -d worker-gpu
    build: {context: ./backend, dockerfile: ../infra/docker/worker-gpu.Dockerfile}
    command: celery -A app.workers.celery_app worker -Q generate,train -c 1 --pool=solo -l info
    environment: *backend-env
    volumes: [appdata:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped
    profiles: [gpu]
    logging: *log

  worker-mock:  # CI / no-GPU demo ONLY: images are stamped MOCK
    build: {context: ./backend, dockerfile: ../infra/docker/api.Dockerfile}
    command: celery -A app.workers.celery_app worker -Q generate -c 1 -l info
    environment: {<<: *backend-env, IMAGE_PROVIDER: mock}
    volumes: [appdata:/data]
    depends_on: {redis: {condition: service_healthy}}
    profiles: [mock]

volumes:
  pgdata:
  appdata:
